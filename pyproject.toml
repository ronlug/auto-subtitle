[project]
name = "subtitle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ronlug", email = "ronlug@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=11,<16",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.8,<12.9.3 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9 ; sys_platform == 'win32' or sys_platform == 'linux'",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
subtitle = "subtitle.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
